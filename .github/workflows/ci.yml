name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One pipeline per branch. Never cancel a deploy that is already running;
# only superseded pull-request runs are cancelled.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AZURE_WEBAPP_NAME_DEV: app-inventory-hub-dev-nb01

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      # pyodbc needs the unixODBC library to import on Linux
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  deploy-dev:
    name: Deploy to dev
    needs: test
    # Pull requests only run the tests; they never deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write # lets the job request an OIDC token for the Azure login
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Only the files the app needs at runtime. Azure installs requirements.txt itself
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true), so no packages are bundled here.
      - name: Package application
        run: zip -r app.zip main.py db.py auth.py schemas.py repository.py routers requirements.txt -x "*/__pycache__/*"

      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_DEV }}
          package: app.zip

      # A deploy that "succeeded" can still be a broken app, so check it is really up.
      # Free-tier apps and the serverless database both start slowly, so retry patiently.
      - name: Smoke test
        env:
          BASE_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          BASE_URL="${BASE_URL%/}"
          check() {
            local path="$1" tries="$2" code
            for i in $(seq 1 "$tries"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL$path" || true)
              echo "$path attempt $i/$tries -> HTTP $code"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 15
            done
            echo "::error::$path did not return 200 after $tries attempts"
            return 1
          }
          check /health 20
          check /health/db 12
