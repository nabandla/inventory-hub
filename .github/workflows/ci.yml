name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One pipeline per branch. Never cancel a deploy that is already running;
# only superseded pull-request runs are cancelled.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AZURE_WEBAPP_NAME_DEV: app-inventory-hub-dev-nb01
  AZURE_WEBAPP_NAME_PROD: app-inventory-hub-prod-nb01

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      # pyodbc needs the unixODBC library to import on Linux
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  # Build the deployable package once. Dev and prod receive this exact same file,
  # so prod gets the build that was already tested and smoke-tested in dev.
  package:
    name: Package
    needs: test
    # Pull requests only run the tests; they never deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Only the files the app needs at runtime. Azure installs requirements.txt itself
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true), so no packages are bundled here.
      # Every top-level *.py is an application module (tests live in tests/), so new
      # modules are included automatically instead of being forgotten in a hand-kept list.
      - name: Package application
        run: zip -r app.zip *.py routers requirements.txt -x "*/__pycache__/*"

      # Prove the zip is self-contained BEFORE it can reach Azure: unpack it in an empty
      # folder with only the runtime dependencies and import the app, as Azure would.
      - name: Set up Python (package check)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify the package starts
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc
          python -m venv /tmp/pkgenv
          /tmp/pkgenv/bin/pip install --quiet -r requirements.txt
          mkdir /tmp/pkgcheck
          unzip -q app.zip -d /tmp/pkgcheck
          cd /tmp/pkgcheck
          /tmp/pkgenv/bin/python -c "import main; print('package imports OK:', len(main.app.routes), 'routes')"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: Deploy to dev
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write # lets the job request an OIDC token for the Azure login
      contents: read
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (dev)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_DEV }}
          package: app.zip

      # A deploy that "succeeded" can still be a broken app, so check it is really up.
      # Apps and the serverless database both start slowly, so retry patiently.
      - name: Smoke test
        env:
          BASE_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          BASE_URL="${BASE_URL%/}"
          check() {
            local path="$1" tries="$2" code
            for i in $(seq 1 "$tries"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL$path" || true)
              echo "$path attempt $i/$tries -> HTTP $code"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 15
            done
            echo "::error::$path did not return 200 after $tries attempts"
            return 1
          }
          check /health 20
          check /health/db 12

      # Read-only: with no key the API must answer 401 (proves auth is active and API_KEY is set)
      - name: Check authentication is enforced
        env:
          BASE_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          # A bare 401 is not enough: an older version that is still answering for a moment after
          # the deploy returns 401 too. Only the new token authentication answers with
          # "WWW-Authenticate: Bearer". A 200 means authentication is open and fails at once.
          for i in $(seq 1 20); do
            headers=$(curl -s -D - -o /dev/null --max-time 30 "${BASE_URL%/}/v1/items" || true)
            code=$(echo "$headers" | head -n1 | awk '{print $2}')
            echo "GET /v1/items without a token, attempt $i/20 -> HTTP ${code:-none}"
            if [ "$code" = "401" ] && echo "$headers" | grep -qi '^www-authenticate: *bearer'; then exit 0; fi
            if [ "$code" = "200" ]; then echo "::error::authentication is NOT enforced (got 200 without a token)"; exit 1; fi
            sleep 15
          done
          echo "::error::expected 401 with a Bearer challenge, last status was ${code:-none}"
          exit 1

  deploy-prod:
    name: Deploy to prod
    needs: deploy-dev # only after dev deployed and passed its smoke tests
    # Only from main, never from another branch started by hand
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The 'prod' environment requires a human approval before this job starts
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (prod)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_PROD }}
          package: app.zip

      - name: Smoke test
        env:
          BASE_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          BASE_URL="${BASE_URL%/}"
          check() {
            local path="$1" tries="$2" code
            for i in $(seq 1 "$tries"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL$path" || true)
              echo "$path attempt $i/$tries -> HTTP $code"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 15
            done
            echo "::error::$path did not return 200 after $tries attempts"
            return 1
          }
          check /health 20
          check /health/db 12

      # Read-only on purpose: never create or change data in prod from a pipeline
      - name: Check authentication is enforced
        env:
          BASE_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          # A bare 401 is not enough: an older version that is still answering for a moment after
          # the deploy returns 401 too. Only the new token authentication answers with
          # "WWW-Authenticate: Bearer". A 200 means authentication is open and fails at once.
          for i in $(seq 1 20); do
            headers=$(curl -s -D - -o /dev/null --max-time 30 "${BASE_URL%/}/v1/items" || true)
            code=$(echo "$headers" | head -n1 | awk '{print $2}')
            echo "GET /v1/items without a token, attempt $i/20 -> HTTP ${code:-none}"
            if [ "$code" = "401" ] && echo "$headers" | grep -qi '^www-authenticate: *bearer'; then exit 0; fi
            if [ "$code" = "200" ]; then echo "::error::authentication is NOT enforced (got 200 without a token)"; exit 1; fi
            sleep 15
          done
          echo "::error::expected 401 with a Bearer challenge, last status was ${code:-none}"
          exit 1
